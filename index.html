<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock code</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 50px;
      background-color: #f8f8f8;
    }

    #game-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      display: inline-block;
    }

    input {
      width: 50px;
      font-size: 20px;
      text-align: center;
      margin: 5px;
    }

    button {
      padding: 10px;
      font-size: 18px;
      margin-top: 10px;
      cursor: pointer;
    }

    #attempts-left {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="game-container">
    <h2>Selecting a lock code</h2>

    <h3>Enter your option:</h3>
    <input type="text" id="digit1" maxlength="1" oninput="validateInput(this)">
    <input type="text" id="digit2" maxlength="1" oninput="validateInput(this)">
    <input type="text" id="digit3" maxlength="1" oninput="validateInput(this)">

    <br><br>
    <label>How many numbers are guessed?</label>
    <input type="number" id="correctCount" min="0" max="3">

    <br>
    <button onclick="checkGuess()">Check</button>

    <p>Attempts left: <strong id="attempts-left">9</strong></p>
    <p id="remaining-codes"></p>
  </div>

  <script>
    let attempts = 9;
    let possibleCodes = generateAllPossibleCodes();
    let eliminatedDigits = new Set(); // Храним исключенные цифры
    let usedDigits = new Set(); // Цифры, которые точно есть в коде

    function generateAllPossibleCodes() {
      let codes = [];
      for (let i = 0; i <= 9; i++) {
        for (let j = 0; j <= 9; j++) {
          for (let k = 0; k <= 9; k++) {
            if (i !== j && j !== k && i !== k) { // Без повторений
              codes.push([i, j, k]);
            }
          }
        }
      }
      return codes;
    }

    function validateInput(input) {
      input.value = input.value.replace(/[^0-9]/g, ''); // Убираем нечисловые символы
    }

    function checkGuess() {
      if (attempts <= 0) return;

      let digit1 = parseInt(document.getElementById('digit1').value);
      let digit2 = parseInt(document.getElementById('digit2').value);
      let digit3 = parseInt(document.getElementById('digit3').value);
      let correctCount = parseInt(document.getElementById('correctCount').value);

      if (isNaN(digit1) || isNaN(digit2) || isNaN(digit3) || isNaN(correctCount)) {
        alert("Enter all numbers!");
        return;
      }

      let guess = [digit1, digit2, digit3];

      if (correctCount === 0) {
        // Если угадано 0 цифр, полностью исключаем эти цифры
        eliminatedDigits.add(digit1);
        eliminatedDigits.add(digit2);
        eliminatedDigits.add(digit3);
      } else {
        // Если угадано хотя бы 1 число, оно точно есть в коде
        for (let num of guess) {
          if (!eliminatedDigits.has(num)) {
            usedDigits.add(num);
          }
        }
      }

      // Фильтруем возможные коды
      possibleCodes = possibleCodes.filter(code => {
        // Удаляем коды, содержащие исключенные цифры
        for (let num of code) {
          if (eliminatedDigits.has(num)) {
            return false;
          }
        }

        // Проверяем, сколько цифр из текущего кода совпадает с введенными
        let matchCount = 0;
        for (let num of guess) {
          if (code.includes(num)) {
            matchCount++;
          }
        }
        return matchCount === correctCount;
      });

      attempts--;
      document.getElementById('attempts-left').textContent = attempts;

      if (possibleCodes.length === 1) {
        document.getElementById('remaining-codes').innerHTML = `<span style='color: green;'>Код найден: ${possibleCodes[0].join('')}</span>`;
        attempts = 0;
      } else if (attempts === 0) {
        document.getElementById('remaining-codes').innerHTML = "<span style='color: red;'>Игра проиграна! Код не найден.</span>";
      } else {
        document.getElementById('remaining-codes').innerHTML = `Possible codes: ${possibleCodes.length}<br>Next option: ${possibleCodes[0].join('')}`;
      }

      // Очищаем поля ввода
      document.getElementById('digit1').value = "";
      document.getElementById('digit2').value = "";
      document.getElementById('digit3').value = "";
      document.getElementById('correctCount').value = "";
    }
  </script>

</body>

</html>
